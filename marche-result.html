<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>縁の鑑定書</title>
<style>
  :root {
    --washi: #f7f2e7;
    --washi-field: #fffdf8;
    --gold: #c9b784;
    --gold-soft: #a08b4f;
    --sumi: #2b2620;
    --sumi-dim: #6b6355;
    --sumi-faint: #8a8170;
    --shu: #c8443b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    color: var(--sumi);
    background: #211c16;
    display: flex;
    justify-content: center;
    padding: 24px 14px 60px;
    word-break: auto-phrase;
    line-break: strict;
    text-wrap: pretty;
  }

  .sheet {
    width: 100%;
    max-width: 560px;
    background: var(--washi);
    border-radius: 16px;
    box-shadow:
      inset 0 0 0 7px var(--washi),
      inset 0 0 0 8px var(--gold),
      0 18px 50px rgba(0,0,0,0.45);
    padding: 32px 24px 28px;
  }

  header { text-align: center; margin-bottom: 8px; }

  .brand-icon {
    display: block;
    width: 64px; height: 64px;
    margin: 0 auto 10px;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.3em;
    color: var(--gold-soft);
    margin: 0 0 6px;
    padding-left: 0.3em;
  }
  .site-title {
    font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
    font-size: 21px;
    font-weight: 600;
    color: var(--shu);
    letter-spacing: 0.12em;
    margin: 0;
  }

  /* ===== 読み込み中 ===== */
  #loading { text-align: center; padding: 44px 0 34px; }
  .load-main {
    font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
    font-size: 18px;
    color: var(--shu);
    letter-spacing: 0.1em;
    margin: 0 0 10px;
  }
  .load-sub { font-size: 13px; color: var(--sumi-dim); margin: 0; line-height: 1.9; }
  .dots::after { content: ""; animation: dots 1.4s steps(4, end) infinite; }
  @keyframes dots {
    0% { content: ""; } 25% { content: "・"; }
    50% { content: "・・"; } 75% { content: "・・・"; }
  }

  /* ===== お知らせ（期限切れ・見つからない・通信失敗） ===== */
  #notice { display: none; text-align: center; padding: 40px 6px 30px; }
  #notice.show { display: block; }
  .notice-main {
    font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
    font-size: 19px;
    line-height: 1.8;
    color: var(--shu);
    letter-spacing: 0.08em;
    margin: 0 0 16px;
  }
  .notice-sub {
    font-size: 13.5px;
    line-height: 2;
    color: var(--sumi-dim);
    margin: 0;
  }
  .notice-rule {
    width: 60px; height: 1px;
    background: var(--gold);
    border: 0;
    margin: 22px auto;
  }

  /* ===== 鑑定書本体 ===== */
  #cert { display: none; }
  #cert.show { display: block; }

  .cert-band {
    text-align: center;
    margin: 18px 0 4px;
    padding-top: 16px;
    border-top: 1px solid var(--gold);
  }
  .cert-band-note {
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--gold-soft);
    margin: 0;
  }

  .cert-h2 {
    font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 0.1em;
    color: var(--sumi);
    margin: 26px 0 12px;
    padding-bottom: 7px;
    border-bottom: 1px solid var(--gold);
  }
  .cert-h3 {
    font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
    font-weight: 600;
    font-size: 15.5px;
    letter-spacing: 0.06em;
    color: var(--shu);
    margin: 18px 0 7px;
  }
  .cert-p {
    font-size: 14px;
    line-height: 1.95;
    color: var(--sumi);
    margin: 0 0 10px;
  }
  .cert-kv {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin: 0 0 7px;
  }
  .cert-kv-key {
    flex: 0 0 4.4em;
    font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
    font-size: 12.5px;
    letter-spacing: 0.12em;
    color: var(--gold-soft);
    white-space: nowrap;
  }
  .cert-kv-val {
    flex: 1;
    font-size: 14px;
    line-height: 1.9;
    color: var(--sumi);
  }
  .cert-closing {
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid var(--gold);
    font-size: 13px;
    line-height: 2;
    color: var(--sumi-dim);
  }
  .cert-disclaimer {
    font-size: 11.5px;
    line-height: 1.9;
    color: var(--sumi-faint);
    margin-top: 14px;
  }
  .cert-footer {
    margin-top: 20px;
    font-size: 11.5px;
    letter-spacing: 0.08em;
    color: var(--gold-soft);
    text-align: right;
  }

  /* ===== フォロー導線 ===== */
  .follow {
    margin-top: 26px;
    padding-top: 20px;
    border-top: 1px solid var(--gold);
    text-align: center;
  }
  .follow-lead {
    font-size: 13.5px;
    line-height: 1.9;
    color: var(--sumi-dim);
    margin: 0 0 14px;
  }
  .follow-btn {
    display: inline-block;
    padding: 13px 28px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-decoration: none;
    color: #fff;
    background: var(--shu);
    border-radius: 999px;
  }

  @media (max-width: 600px) {
    .cert-kv-key { flex-basis: 4em; font-size: 12px; }
  }
</style>
</head>
<body>
  <main class="sheet">

    <header>
      <img class="brand-icon" src="icon.png" alt="楽研" onerror="this.style.display='none'">
      <p class="eyebrow">人生楽しんだもん価値研究所</p>
      <p class="site-title">縁の鑑定書</p>
    </header>

    <!-- 読み込み中 -->
    <div id="loading">
      <p class="load-main">鑑定書をひらいています<span class="dots"></span></p>
      <p class="load-sub">少しお待ちください。</p>
    </div>

    <!-- お知らせ -->
    <div id="notice">
      <p class="notice-main" id="noticeMain"></p>
      <hr class="notice-rule">
      <p class="notice-sub" id="noticeSub"></p>
    </div>

    <!-- 鑑定書 -->
    <div id="cert">
      <div class="cert-band">
        <p class="cert-band-note">この鑑定書は、発行から3日でご覧いただけなくなります</p>
      </div>
      <div id="certBody"></div>
      <p class="cert-footer" id="certFooter"></p>

      <div class="follow">
        <p class="follow-lead">
          こういうものを、日々つくっています。<br>
          よかったら覗いてみてください。
        </p>
        <a class="follow-btn" href="https://www.instagram.com/tanoshinda_lab/" target="_blank" rel="noopener">Instagramを見る</a>
      </div>
    </div>

  </main>

  <script>
    /* =========================================================
       マルシェ版シナリオB「縁_マルシェ_閲覧」のCustom webhook。
       鑑定側（縁_マルシェ_鑑定）とは別のURL。混同しないこと。
       ========================================================= */
    const WEBHOOK_URL = "https://hook.eu1.make.com/cssh9sdm3o088kpk5j85l28dapl7nt4c";

    const loading    = document.getElementById('loading');
    const notice     = document.getElementById('notice');
    const noticeMain = document.getElementById('noticeMain');
    const noticeSub  = document.getElementById('noticeSub');
    const cert       = document.getElementById('cert');
    const certBody   = document.getElementById('certBody');
    const certFooter = document.getElementById('certFooter');

    /* 縁獣の項目立て表示（将来、画像ありの鑑定文を流しても崩れないように残す） */
    const KEMONO_KEYS = /^(縁獣名|生息地|特技|弱点|姿)\s*：/;

    function showNotice(main, sub) {
      loading.style.display = 'none';
      noticeMain.textContent = main;
      noticeSub.innerHTML = sub;
      notice.classList.add('show');
    }

    function renderCertificate(text) {
      certBody.innerHTML = '';
      const lines = text.split('\n');
      let para = null;
      for (const raw of lines) {
        const line = raw.trim();
        if (!line) { para = null; continue; }
        let el;
        if (/^【.+】$/.test(line)) {
          el = document.createElement('h2');
          el.className = 'cert-h2';
          el.textContent = line.replace(/^【|】$/g, '');
          para = null;
        } else if (/^[①②③④]/.test(line)) {
          el = document.createElement('h3');
          el.className = 'cert-h3';
          el.textContent = line;
          para = null;
        } else if (KEMONO_KEYS.test(line)) {
          const idx = line.indexOf('：');
          el = document.createElement('div');
          el.className = 'cert-kv';
          const k = document.createElement('span');
          k.className = 'cert-kv-key';
          k.textContent = line.slice(0, idx);
          const v = document.createElement('span');
          v.className = 'cert-kv-val';
          v.textContent = line.slice(idx + 1).trim();
          el.appendChild(k);
          el.appendChild(v);
          para = null;
        } else if (line.startsWith('鑑定の結論として')) {
          el = document.createElement('p');
          el.className = 'cert-closing';
          el.textContent = line;
          para = null;
        } else if (line.startsWith('※')) {
          el = document.createElement('p');
          el.className = 'cert-disclaimer';
          el.textContent = line;
          para = null;
        } else {
          if (para) {
            para.appendChild(document.createElement('br'));
            para.appendChild(document.createTextNode(line));
            continue;
          }
          el = document.createElement('p');
          el.className = 'cert-p';
          el.textContent = line;
          para = el;
        }
        certBody.appendChild(el);
      }
      certFooter.textContent = '人生楽しんだもん価値研究所';
      loading.style.display = 'none';
      cert.classList.add('show');
    }

    (async function () {
      const id = new URLSearchParams(window.location.search).get('id');

      if (!id) {
        showNotice(
          'この鑑定書は見つかりませんでした',
          'URLが途中で切れているかもしれません。<br>もう一度QRコードを読み取ってみてください。'
        );
        return;
      }

      try {
        const res  = await fetch(WEBHOOK_URL + '?id=' + encodeURIComponent(id));
        const text = (await res.text()).trim();

        if (res.status !== 200) {
          showNotice(
            'うまく開けませんでした',
            '少し時間をおいて、<br>もう一度お試しください。'
          );
          return;
        }

        if (text === 'EXPIRED') {
          showNotice(
            'この鑑定書は公開期間を終了しました',
            'ご覧いただける期間は発行から3日間です。<br>またマルシェでお会いしましょう。'
          );
          return;
        }

        /* 鑑定文は必ず数百文字になる。短い応答は「見つからない」等の案内文 */
        if (text.length < 150) {
          showNotice(
            'この鑑定書は見つかりませんでした',
            text || 'QRコードを読み直してみてください。'
          );
          return;
        }

        renderCertificate(text);

      } catch (e) {
        showNotice(
          '通信に失敗しました',
          '電波の良いところで、<br>もう一度お試しください。'
        );
      }
    })();
  </script>
</body>
</html>
